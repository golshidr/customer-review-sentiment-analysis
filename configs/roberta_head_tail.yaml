# Ablation: RoBERTa-base keeping the first 128 and last 382 tokens of long reviews
# instead of only the first 510.
name: roberta_head_tail
model_name: roberta-base
max_length: 512
truncation: head_tail
head_tokens: 128
learning_rate: 2.0e-5
weight_decay: 0.01
epochs: 2
batch_size: 16
eval_batch_size: 128
warmup_ratio: 0.06
seed: 42
bf16: true
