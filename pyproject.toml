[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "review-sentiment"
version = "0.2.0"
description = "Sentiment analysis of reviews: TF-IDF baseline vs fine-tuned transformers, with explainability, robustness and cross-domain evaluation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Golshid Ranjbaran" }]
dependencies = [
    "numpy",
    "pandas",
    "pyarrow",
    "scikit-learn",
    "scipy",
    "matplotlib",
    "pyyaml",
    "joblib",
]

[project.optional-dependencies]
transformers = ["torch", "transformers", "datasets", "accelerate", "captum", "sentencepiece", "protobuf"]
app = ["gradio"]
dev = ["pytest", "ruff"]

[project.scripts]
review-sentiment = "review_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: tests that download models or data (deselected in CI)"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts", "app"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["review_sentiment"]
