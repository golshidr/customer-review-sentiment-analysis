name: CI

on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: Install (CPU only, no model downloads)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt
          pip install -e . --no-deps
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (synthetic data)
        env:
          MPLBACKEND: Agg
        run: pytest -m "not slow"
